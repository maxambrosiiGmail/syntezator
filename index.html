<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Клавиши">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Клавиши — тренажёр для синтезатора</title>
<style>
:root{--bg:#0c0f1c;--panel:#161a31;--line:#2a3050;--text:#e8ebff;--mute:#8d94b8;--acc:#5b8cff;--ok:#3ddc97;--bad:#ff5d6c;--warn:#ffd166}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:960px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;gap:6px;padding:6px 8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px}
button{cursor:pointer}
button,select,input{touch-action:manipulation}
button:active{transform:scale(.97)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#song{flex:1;min-width:140px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:8px 10px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.tempo{display:flex;align-items:center;gap:6px;flex:1;min-width:150px;color:var(--mute);font-size:14px}
.tempo input{flex:1;accent-color:var(--acc)}
.tempo b{color:var(--text);min-width:28px;text-align:right;font-weight:600}
.chip{font-size:13px;padding:6px 10px;min-height:32px;color:var(--mute)}
.chip.on{color:var(--text);border-color:var(--acc)}
#hint{padding:2px 12px 6px;font-size:15px;min-height:26px;color:var(--text);display:flex;justify-content:space-between;gap:8px}
#hint span:last-child{color:var(--mute);white-space:nowrap}
#midiS{padding:0 12px 4px;font-size:12px;color:var(--mute);min-height:0}
#midiS:empty{display:none}
#stage{position:relative;flex:1;min-height:300px;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#theory{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:#0a0d1a;padding:10px 14px}
.tcard{max-width:540px;margin:0 auto;padding-bottom:24px}
.tcard h2{margin:4px 0 8px;font-size:22px}
.ttag{color:var(--mute);font-size:12px}
#tBody p,#tBody li{font-size:16px;line-height:1.45;margin:8px 0}
#tBody ul{padding-left:20px;margin:6px 0}
.trow{display:flex;justify-content:space-between;gap:8px;margin-top:16px;position:sticky;bottom:0;padding:12px 0 6px;background:linear-gradient(rgba(10,13,26,0),#0a0d1a 35%)}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,20,.72)}
#result[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(86%,340px);text-align:center}
.card h2{margin:0 0 6px;font-size:20px}
.stars{font-size:34px;letter-spacing:4px;color:var(--warn);margin:6px 0}
.card p{margin:4px 0 14px;color:var(--mute);font-size:14px}
.card .row{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <select id="song" aria-label="Урок или песня"></select>
    <div class="seg" id="modes">
      <button data-m="watch">Смотреть</button>
      <button data-m="wait" class="on">Ждать</button>
      <button data-m="play">Играть</button>
    </div>
  </div>
  <div class="bar">
    <button id="go" class="primary">▶ Старт</button>
    <button id="restart" aria-label="Сначала">↺</button>
    <label class="tempo">♩ <input type="range" id="tempo" min="30" max="160" step="5" value="80"><b id="tempoV">80</b></label>
  </div>
  <div class="bar">
    <button class="chip" id="theoryBtn">📖 Теория</button>
    <button class="chip" id="names">До Ре Ми</button>
    <select class="chip" id="sound" aria-label="Звук">
      <option value="piano">Звук: пиано</option>
      <option value="organ">Звук: орган</option>
      <option value="synth">Звук: синт</option>
    </select>
    <button class="chip on" id="oct">Любая октава: вкл</button>
    <button class="chip" id="midi">Подключить MIDI</button>
    <button class="chip" id="mic">Микрофон</button>
    <button class="chip" id="midiSnd">Звук с MIDI: выкл</button>
  </div>
  <div id="midiS"></div>
  <div class="bar" id="micRow" hidden style="padding-top:0;padding-bottom:4px;color:var(--mute);font-size:13px"><span>Чувствительность</span><input type="range" id="micSens" min="1" max="10" value="8" style="flex:1;accent-color:var(--acc)"></div>
  <div id="hint"><span id="hintL"></span><span id="hintR"></span></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="theory" hidden>
      <div class="tcard">
        <div class="ttag" id="tTag"></div>
        <h2 id="tTitle"></h2>
        <div id="tBody"></div>
        <div class="trow"><button id="tPrev">← Назад</button><button id="tNext" class="primary">Дальше</button></div>
      </div>
    </div>
    <div id="result" hidden>
      <div class="card">
        <h2 id="rTitle"></h2>
        <div class="stars" id="rStars"></div>
        <p id="rText"></p>
        <div class="row"><button id="again">Ещё раз</button><button id="nextSong" class="primary">Дальше</button></div>
      </div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);

/* ---------- ноты и песни ---------- */
const NAMES_LAT=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NAMES_RU=['До','До♯','Ре','Ре♯','Ми','Фа','Фа♯','Соль','Соль♯','Ля','Ля♯','Си'];
let LOW=60, HIGH=84;
const BLACK_PC=[1,3,6,8,10];
function parseNote(n){
  const m=/^([A-G])(#?)(\d)$/.exec(n);
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return 12*(parseInt(m[3],10)+1)+base+(m[2]?1:0);
}
const COL_R='#5b8cff', COL_L='#f59e0b';
const M=(c,o)=>{ const r={}; for(const k in o) r[k]={t:String(o[k]),c}; return r; };
function kbSvg(lo,hi,marks){
  const kw=30, kh=100, whites=[];
  for(let m=lo;m<=hi;m++) if(!BLACK_PC.includes(m%12)) whites.push(m);
  const W=whites.length*kw;
  let o='<svg viewBox="0 0 '+W+' '+(kh+24)+'" width="100%" role="img" style="display:block;margin:10px 0">';
  whites.forEach((m,i)=>{
    const mk=marks&&marks[m], cx=i*kw+kw/2;
    o+='<rect x="'+(i*kw)+'" y="0" width="'+kw+'" height="'+kh+'" fill="'+(mk?mk.c+'55':'#f3f4fb')+'" stroke="#9aa0c0"/>';
    o+='<text x="'+cx+'" y="'+(kh+16)+'" text-anchor="middle" font-size="11" fill="'+(m%12===0?'#9db8ff':'#8d94b8')+'" font-weight="'+(m%12===0?'700':'400')+'">'+NAMES_RU[m%12]+'</text>';
    if(mk){
      o+='<circle cx="'+cx+'" cy="'+(kh-22)+'" r="11" fill="'+mk.c+'"/>';
      o+='<text x="'+cx+'" y="'+(kh-17)+'" text-anchor="middle" font-size="'+(mk.t.length>1?9:14)+'" font-weight="700" fill="#fff">'+mk.t+'</text>';
    }
  });
  let wi=0;
  for(let m=lo;m<=hi;m++){
    if(BLACK_PC.includes(m%12)) o+='<rect x="'+(wi*30-9)+'" y="0" width="18" height="'+(kh*.62)+'" rx="3" fill="#1a1e34"/>';
    else wi++;
  }
  return o+'</svg>';
}
function handSvg(){
  const fin=(x,y,w,h)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(w/2)+'" fill="#2a3050" stroke="#5b8cff" stroke-width="2"/>';
  const num=(x,y,t)=>'<circle cx="'+x+'" cy="'+y+'" r="11" fill="#5b8cff"/><text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+t+'</text>';
  return '<svg viewBox="0 0 240 165" width="100%" style="display:block;margin:10px auto;max-width:320px" role="img">'
   +'<rect x="76" y="92" width="140" height="62" rx="24" fill="#2a3050" stroke="#5b8cff" stroke-width="2"/>'
   +fin(82,26,28,78)+fin(116,10,28,94)+fin(150,24,28,80)+fin(184,48,26,56)
   +'<rect x="30" y="84" width="28" height="64" rx="14" fill="#2a3050" stroke="#5b8cff" stroke-width="2" transform="rotate(-35 44 116)"/>'
   +num(96,40,2)+num(130,24,3)+num(164,38,4)+num(197,62,5)+num(28,98,1)
   +'<text x="146" y="144" text-anchor="middle" font-size="10" fill="#8d94b8">правая рука, вид сверху</text></svg>';
}
function rhythmSvg(){
  const rows=[['Целая',4,'4 счёта'],['Половинная',2,'2 счёта'],['Четвертная',1,'1 счёт'],['Восьмая',.5,'½ счёта']];
  let o='<svg viewBox="0 0 340 140" width="100%" style="display:block;margin:10px 0" role="img">';
  rows.forEach((r,i)=>{
    const y=i*34+4;
    o+='<text x="0" y="'+(y+18)+'" font-size="13" fill="#e8ebff">'+r[0]+'</text>';
    o+='<rect x="100" y="'+y+'" width="'+(r[1]*50)+'" height="24" rx="6" fill="#5b8cff"/>';
    o+='<text x="'+(100+r[1]*50+8)+'" y="'+(y+17)+'" font-size="12" fill="#8d94b8">'+r[2]+'</text>';
  });
  return o+'</svg>';
}
const LEG='<p><span style="color:#7aa2ff">Синие</span> ноты играет правая рука, <span style="color:#f59e0b">оранжевые</span> — левая.</p>';

const ITEMS=[
 {id:'posture',g:'Уроки',title:'1. Посадка и руки',bpm:70,seq:'',pages:[
  {h:'Как сесть',b:`<p>Хорошая посадка — половина успеха: руки не устают, и играть проще.</p>
<ul><li>Сядь ровно напротив середины клавиатуры, на переднюю половину стула, не откидываясь на спинку.</li>
<li>Высота: предплечья почти параллельно полу, локти на уровне клавиш. Если ниже — подложи подушку на стул.</li>
<li>Расстояние: руки свободно достают до клавиш, не тянутся. Локти чуть впереди тела.</li>
<li>Ноги стоят на полу, плечи опущены и расслаблены.</li></ul>`},
  {h:'Кисть и пальцы',b:`<ul><li>Кисть на одной линии с предплечьем: не провисает вниз и не задрана вверх.</li>
<li>Пальцы слегка округлены, как будто держишь небольшое яблоко.</li>
<li>Играй подушечками пальцев, а не плоскими пальцами. Ногти должны быть короткими.</li>
<li>Большой палец играет боком, у ногтя, и не ложится на клавишу плашмя.</li>
<li>Нажимай плавно, не бей по клавишам: вес руки переходит в палец, звук получается ровным.</li>
<li>Если кисть устала или болит — остановись и потряси руками.</li></ul>`},
  {h:'Номера пальцев',b:`<p>Пальцы нумеруются одинаково на обеих руках:</p>${handSvg()}
<p><b>1</b> — большой, <b>2</b> — указательный, <b>3</b> — средний, <b>4</b> — безымянный, <b>5</b> — мизинец.</p>
<p>В приложении цифра на падающей ноте — это палец, которым её нужно играть.</p>${LEG}`}
 ]},
 {id:'keys',g:'Уроки',title:'2. Клавиатура и ноты',bpm:60,seq:'C4:1 E4:1 G4:1 C4:1 G4:1 E4:1 C4:2 D4:1 F4:1 D4:1 E4:1 G4:1 E4:1 C4:2',pages:[
  {h:'Белые и чёрные клавиши',b:`<p>На клавиатуре повторяется один узор — октава. В нём 7 белых клавиш: <b>До Ре Ми Фа Соль Ля Си</b>, а после Си снова начинается До, но выше.</p>
<p>Чёрные клавиши идут группами: две, потом три. По этим группам легко ориентироваться.</p>${kbSvg(60,83)}`},
  {h:'Как найти ноту До',b:`<p><b>До</b> — белая клавиша слева от группы из двух чёрных. Найди её на своём синтезаторе: она есть в каждой октаве.</p>
<p>Ми и Фа стоят рядом, между ними нет чёрной клавиши. Так же рядом Си и До.</p>${kbSvg(60,71,M(COL_R,{60:'До'}))}
<p>Начинай с До, которая ближе к середине клавиатуры. В приложении это самая левая клавиша. Любая другая До тоже подойдёт, пока включена «Любая октава».</p>
<p>В этом упражнении пальцы пока не важны: просто найди ноты по названиям.</p>`}
 ]},
 {id:'pos',g:'Уроки',title:'3. Правая рука: позиция «До»',bpm:60,seq:'C4:1:1 D4:1:2 E4:1:3 F4:1:4 G4:1:5 F4:1:4 E4:1:3 D4:1:2 C4:2:1 C4:1:1 D4:1:2 E4:1:3 F4:1:4 G4:1:5 F4:1:4 E4:1:3 D4:1:2 C4:2:1',pages:[
  {h:'Позиция «До»',b:`<p>Поставь правую руку так, чтобы большой палец (1) лежал на До, а остальные пальцы — на соседних белых клавишах подряд:</p>
${kbSvg(60,71,M(COL_R,{60:1,62:2,64:3,65:4,67:5}))}
<p>1 — До, 2 — Ре, 3 — Ми, 4 — Фа, 5 — Соль. У каждого пальца своя клавиша: рука не прыгает, пальцы просто нажимают.</p>`},
  {h:'Как играть упражнение',b:`<ul><li>Нажимай подушечкой пальца и отпускай клавишу, когда пора играть следующую. Остальные пальцы держи над своими клавишами.</li>
<li>Смотри на цифру на ноте: это палец. Рука не должна сдвигаться со своего места.</li>
<li>Режим «Ждать»: приложение ждёт, пока сыграешь правильную ноту. Начни с него. Когда получается без ошибок, переходи на «Играть» — там всё идёт в темп.</li>
<li>Сначала играй медленно (ползунок темпа), потом ускоряйся.</li></ul>`}
 ]},
 {id:'pos2',g:'Уроки',title:'4. Пальцы вразнобой',bpm:60,seq:'C4:1:1 E4:1:3 D4:1:2 F4:1:4 E4:1:3 G4:1:5 F4:1:4 E4:1:3 D4:1:2 C4:2:1',pages:[
  {h:'Пальцы не по порядку',b:`<p>Теперь пальцы играют не подряд. Так рука привыкает к позиции, а пальцы становятся независимыми.</p>
<p>Смотри на цифры и на экран, а не на руки. Если ошибся, не торопись: сыграй медленнее.</p>`}
 ]},
 {id:'buns',g:'Уроки',title:'5. Первая песня: Hot Cross Buns',bpm:80,seq:'E4:1:3 D4:1:2 C4:2:1 E4:1:3 D4:1:2 C4:2:1 C4:.5:1 C4:.5:1 C4:.5:1 C4:.5:1 D4:.5:2 D4:.5:2 D4:.5:2 D4:.5:2 E4:1:3 D4:1:2 C4:2:1',pages:[
  {h:'Три пальца',b:`<p>Первая песня играется тремя пальцами: Ми — 3, Ре — 2, До — 1. Руку двигать не нужно.</p>
<p>Короткие ноты (по полсчёта) в середине играй быстрее и одним и тем же пальцем. Если не получается, снизь темп.</p>`}
 ]},
 {id:'ode',g:'Уроки',title:'6. Ода к радости',bpm:100,seq:'E4:1:3 E4:1:3 F4:1:4 G4:1:5 G4:1:5 F4:1:4 E4:1:3 D4:1:2 C4:1:1 C4:1:1 D4:1:2 E4:1:3 E4:1.5:3 D4:.5:2 D4:2:2 E4:1:3 E4:1:3 F4:1:4 G4:1:5 G4:1:5 F4:1:4 E4:1:3 D4:1:2 C4:1:1 C4:1:1 D4:1:2 E4:1:3 D4:1.5:2 C4:.5:1 C4:2:1',pages:[
  {h:'Вся мелодия в одной позиции',b:`<p>Мелодия Бетховена целиком играется в позиции «До»: руку двигать не нужно.</p>
<p>В конце фразы длинная нота держится полтора счёта, а следующая короткая — полсчёта. Считай вслух: «раз, два-и».</p>`}
 ]},
 {id:'jingle',g:'Уроки',title:'7. Jingle Bells (припев)',bpm:100,seq:'E4:1:3 E4:1:3 E4:2:3 E4:1:3 E4:1:3 E4:2:3 E4:1:3 G4:1:5 C4:1.5:1 D4:.5:2 E4:4:3 F4:1:4 F4:1:4 F4:1.5:4 F4:.5:4 F4:1:4 E4:1:3 E4:1:3 E4:.5:3 E4:.5:3 E4:1:3 D4:1:2 D4:1:2 E4:1:3 D4:2:2 G4:2:5',pages:[
  {h:'Все пять пальцев',b:`<p>В припеве работают все пять пальцев. Соль играет мизинец (5), а До — большой (1): после Соль рука «падает» на До, следи, чтобы кисть оставалась на месте.</p>
<p>Фа играй безымянным (4). Самое длинное место — Ми на четыре счёта: держи клавишу и считай до четырёх.</p>`}
 ]},
 {id:'rhythm',g:'Уроки',title:'8. Ритм: длинные и короткие ноты',bpm:70,seq:'C4:4:1 D4:2:2 E4:2:3 C4:1:1 D4:1:2 E4:1:3 C4:1:1 C4:.5:1 D4:.5:2 E4:.5:3 D4:.5:2 C4:2:1',pages:[
  {h:'Длительности нот',b:`<p>Каждая нота длится определённое число счётов (ударов). На экране длинная нота выглядит длиннее.</p>${rhythmSvg()}`},
  {h:'Как считать',b:`<ul><li>Четвертная — один счёт: нажал на «раз», отпустил на «два».</li>
<li>Половинная — два счёта: нажал на «раз», держишь «два», отпускаешь на «три».</li>
<li>Целая — четыре счёта.</li>
<li>Восьмая — полсчёта: две восьмые умещаются в один счёт, считай «раз-и».</li></ul>
<p>Считай вслух, пока играешь. Это главный способ играть ровно. В режиме «Играть» приложение оценивает, попал ли ты в начало каждой ноты.</p>`}
 ]},
 {id:'left',g:'Уроки',title:'9. Левая рука: позиция «До»',bpm:60,lo:48,seq:'C3:1:5L D3:1:4L E3:1:3L F3:1:2L G3:1:1L F3:1:2L E3:1:3L D3:1:4L C3:2:5L C3:1:5L D3:1:4L E3:1:3L F3:1:2L G3:1:1L F3:1:2L E3:1:3L D3:1:4L C3:2:5L',pages:[

let cur=0, notes=[], endBeat=0, bpm=80;
let mode='wait', state='idle'; // idle | run | pause | done
let beat=-3, nextIdx=0, hits=0, wrong=0, waiting=false;
let ruNames=true, anyOct=true, midiSound=false;
const pressed=new Map();   // id -> {voice, disp, m}
const autoHeld=new Map();  // note -> voice
const bad=new Map();       // disp midi -> time

function loadSong(i,withTheory){
  cur=i;
  const s=ITEMS[i]; let t=0; notes=[];
  for(const tok of s.seq.split(/\s+/)){
    if(!tok) continue;
    const p=tok.split(':'), dur=parseFloat(p[1]);
    if(p[0]!=='R'){
      const fh=p[2]||'';
      notes.push({m:parseNote(p[0]),s:t,d:dur,st:0,f:fh?parseInt(fh,10):0,h:/L/.test(fh)?'L':'R'});
    }
    t+=dur;
  }
  endBeat=t; bpm=s.bpm;
  LOW=s.lo||60; HIGH=LOW+24; layout();
  $('#tempo').value=bpm; $('#tempoV').textContent=bpm;
  $('#song').value=String(i);
  $('#theoryBtn').hidden=!s.pages;
  reset();
  if(withTheory&&s.pages) showTheory(0); else $('#theory').hidden=true;
}
function reset(){
  releaseAuto();
  state='idle'; beat=-3; nextIdx=0; hits=0; wrong=0; waiting=false;
  for(const n of notes) n.st=0;
  $('#result').hidden=true;
  updateGo();
}
function releaseAuto(){ for(const v of autoHeld.values()) voiceOff(v); autoHeld.clear(); }
function updateGo(){
  const b=$('#go');
  if(state==='run') b.textContent='⏸ Пауза';
  else if(state==='pause') b.textContent='▶ Продолжить';
  else if(state==='done') b.textContent='▶ Заново';
  else b.textContent='▶ Старт';
}

/* ---------- звук ---------- */
let ac=null, master=null;
let silentEl=null;
function unlockIOS(){
  if(micStream||micPending) return;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(silentEl) return;
  try{
    silentEl=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=');
    silentEl.loop=true; silentEl.play().catch(()=>{});
  }catch(e){}
}
function ensureAudio(){
  unlockIOS();
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext;
    ac=new C();
    master=ac.createGain(); master.gain.value=.55;
    const comp=ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  if(ac.state==='suspended') ac.resume();
}
function voiceOn(m,vel){
  ensureAudio();
  vel=vel||.8;
  const f=440*Math.pow(2,(m-69)/12), t=ac.currentTime, kind=$('#sound').value;
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
  const oscs=[];
  let dest=g;
  if(kind==='synth'){
    const flt=ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=2200; flt.Q.value=3;
    flt.connect(g); dest=flt;
  }
  g.connect(master);
  const add=(type,freq,level)=>{
    const o=ac.createOscillator(); o.type=type; o.frequency.value=freq;
    const og=ac.createGain(); og.gain.value=level;
    o.connect(og); og.connect(dest); o.start(t); oscs.push(o);
  };
  if(kind==='piano'){
    add('triangle',f,1); add('sine',f*2,.35); add('sine',f*3,.12);
    g.gain.linearRampToValueAtTime(vel*.5,t+.005);
    g.gain.setTargetAtTime(vel*.1,t+.01,.9);
  }else if(kind==='organ'){
    add('sine',f,1); add('sine',f*2,.5); add('sine',f*3,.25); add('sine',f*4,.12);
    g.gain.linearRampToValueAtTime(vel*.3,t+.02);
  }else{
    add('sawtooth',f,.6); add('square',f*.5,.25);
    g.gain.linearRampToValueAtTime(vel*.3,t+.01);
    g.gain.setTargetAtTime(vel*.2,t+.02,.4);
  }
  return {g,oscs,kind};
}
function voiceOff(v){
  if(!v||!ac) return;
  const t=ac.currentTime, rel=v.kind==='piano'?.3:.15;
  try{
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(Math.max(v.g.gain.value,.0001),t);
    v.g.gain.setTargetAtTime(0,t,rel/3);
    v.oscs.forEach(o=>o.stop(t+rel*2+.1));
  }catch(e){}
}
function click(){
  if(micStream) return;
  if(!ac) ensureAudio();
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.frequency.value=1200; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.06);
}

/* ---------- раскладка и клавиатура ---------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,kbH=0,fallH=0,ww=0,ppb=0,dpr=1;
const geom={};
function layout(){
  dpr=window.devicePixelRatio||1;
  const st=$('#stage'); W=st.clientWidth; H=st.clientHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  kbH=Math.max(90,Math.min(150,H*.28)); fallH=H-kbH;
  ww=W/15; ppb=fallH/5;
  for(const k in geom) delete geom[k];
  let wi=0; const bw=ww*.62;
  for(let m=LOW;m<=HIGH;m++){
    if(BLACK_PC.includes(m%12)) geom[m]={x:wi*ww-bw/2,w:bw,b:true};
    else{ geom[m]={x:wi*ww,w:ww,b:false}; wi++; }
  }
}
new ResizeObserver(layout).observe($('#stage'));
window.addEventListener('resize',layout);

function nameOf(m){ return (ruNames?NAMES_RU:NAMES_LAT)[((m%12)+12)%12]; }
function disp(m){
  if(m>=LOW&&m<=HIGH) return m;
  return anyOct?LOW+(m%12):null;
}
function keyAt(x,y){
  const ky=y-fallH; if(ky<0) return null;
  if(ky<kbH*.62){
    for(let m=LOW;m<=HIGH;m++){ const g=geom[m]; if(g.b&&x>=g.x&&x<g.x+g.w) return m; }
  }
  const wi=Math.max(0,Math.min(14,Math.floor(x/ww)));
  let c=0;
  for(let m=LOW;m<=HIGH;m++){ if(!BLACK_PC.includes(m%12)){ if(c===wi) return m; c++; } }
  return null;
}

/* ---------- ввод ---------- */
function match(a,b){ return anyOct?(a%12===b%12):a===b; }
function down(id,m,vel,silent){
  if(pressed.has(id)) up(id);
  const voice=silent?null:voiceOn(m,vel);
  pressed.set(id,{voice,disp:disp(m),m});
  if(state!=='run'||mode==='watch') return;
  if(mode==='wait'){
    const n=notes[nextIdx];
    if(n&&n.s-beat<=1){
      if(match(n.m,m)){ n.st=1; hits++; nextIdx++; if(nextIdx>=notes.length) setTimeout(finish,350); }
      else{ wrong++; markBad(m); }
    }
  }else{
    const w=.3*bpm/60; let best=null;
    for(const n of notes){
      if(n.st===0&&match(n.m,m)){
        const d=Math.abs(n.s-beat);
        if(d<=w&&(!best||d<Math.abs(best.s-beat))) best=n;
      }
    }
    if(best){ best.st=1; hits++; } else if(beat>=-0.5){ wrong++; markBad(m); }
  }
}
function up(id){
  const p=pressed.get(id); if(!p) return;
  voiceOff(p.voice); pressed.delete(id);
}
function markBad(m){ const d=disp(m); if(d!=null) bad.set(d,performance.now()); }

const held=new Map(); // pointerId -> midi
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const r=cv.getBoundingClientRect();
  const m=keyAt(e.clientX-r.left,e.clientY-r.top);
  if(m==null) return;
  held.set(e.pointerId,m); down('p'+e.pointerId,m,.8,!!micStream);
});
const release=e=>{ if(held.has(e.pointerId)){ held.delete(e.pointerId); up('p'+e.pointerId); } };
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);
cv.addEventListener('contextmenu',e=>e.preventDefault());

const KMAP={KeyA:60,KeyW:61,KeyS:62,KeyE:63,KeyD:64,KeyF:65,KeyT:66,KeyG:67,KeyY:68,KeyH:69,KeyU:70,KeyJ:71,KeyK:72,KeyO:73,KeyL:74,KeyP:75,Semicolon:76,Quote:77};
window.addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='SELECT'||tag==='INPUT') return;
  const m0=KMAP[e.code]; if(m0==null) return; const m=m0-60+LOW;
  e.preventDefault(); down('k'+e.code,m,.8);
});
window.addEventListener('keyup',e=>{ if(KMAP[e.code]!=null) up('k'+e.code); });

/* MIDI */
function setMidiStatus(t){ $('#midiS').textContent=t; }
function bindMidi(a){
  const names=[];
  for(const i of a.inputs.values()){ i.onmidimessage=onMidi; names.push(i.name); }
  setMidiStatus(names.length?('MIDI: '+names.join(', ')):'MIDI: устройства не найдены. Подключите синтезатор по USB.');
}
function onMidi(e){
  const st=e.data[0], n=e.data[1], v=e.data[2]||0, cmd=st&0xf0;
  if(cmd===0x90&&v>0) down('m'+n,n,v/127,!midiSound);
  else if(cmd===0x80||(cmd===0x90&&v===0)) up('m'+n);
}
$('#midi').addEventListener('click',async()=>{
  if(!navigator.requestMIDIAccess){
    setMidiStatus('Этот браузер не поддерживает Web MIDI (iPhone/Safari — нет). Нужен Chrome или Edge на компьютере или Android.');
    return;
  }
  try{
    const a=await navigator.requestMIDIAccess();
    bindMidi(a); a.onstatechange=()=>bindMidi(a);
    $('#midi').classList.add('on');
  }catch(err){
    setMidiStatus('MIDI недоступен: '+(err&&err.message?err.message:'доступ запрещён'));
  }
});

/* ---------- микрофон: определение ноты по звуку ---------- */
let micPending=false, micRms=0, micMeterT=0, micNoise=.002, micGain=Math.pow(1.5,3);
let micStream=null, micAn=null, micBuf=null, micTimer=null;
let micState='idle', micCand=null, micCandN=0, micHeld=null, micHeldAt=0, micDiff=0;
const rmsHist=[0,0,0,0,0,0];
function yin(buf,sr){
  const W=1200, maxTau=Math.min(900,Math.floor(sr/65)), minTau=Math.max(2,Math.floor(sr/1500));
  const start=buf.length-(W+maxTau);
  if(start<0) return null;
  const d=new Float32Array(maxTau+1);
  for(let tau=1;tau<=maxTau;tau++){
    let sum=0;
    for(let j=0;j<W;j++){ const x=buf[start+j]-buf[start+j+tau]; sum+=x*x; }
    d[tau]=sum;
  }
  const cm=new Float32Array(maxTau+1); cm[0]=1; let run=0;
  for(let tau=1;tau<=maxTau;tau++){ run+=d[tau]; cm[tau]=run?d[tau]*tau/run:1; }
  for(let tau=minTau;tau<maxTau-1;tau++){
    if(cm[tau]<.25){
      while(tau+1<maxTau-1&&cm[tau+1]<cm[tau]) tau++;
      const a=cm[tau-1], b=cm[tau], c=cm[tau+1], den=a-2*b+c;
      const sh=den?.5*(a-c)/den:0;
      return sr/(tau+sh);
    }
  }
  return null;
}
function freqToMidi(f){ const m=Math.round(69+12*Math.log2(f/440)); return (m>=36&&m<=96)?m:null; }
function showMic(m){
  const lv=Math.max(0,Math.min(5,Math.round(Math.log10(Math.max(micRms,1e-5)/.0005)*2)));
  setMidiStatus('Микрофон '+'▮'.repeat(lv)+'▯'.repeat(5-lv)+(m==null?' слушаю…':' слышу '+nameOf(m)));
}
function micRelease(){ up('mic'); micState='idle'; micCand=null; micCandN=0; micDiff=0; showMic(null); }
function micTick(){
  micAn.getFloatTimeDomainData(micBuf);
  const N=micBuf.length; let s=0;
  for(let i=N-1024;i<N;i++) s+=micBuf[i]*micBuf[i];
  const rms=Math.sqrt(s/1024)*micGain, now=performance.now();
  if(rms<micNoise*1.5) micNoise=micNoise*.98+rms*.02; else micNoise*=1.0005;
  micNoise=Math.min(micNoise,.05);
  const thr=Math.max(.003,micNoise*3+.002);
  micRms=rms;
  if(now-micMeterT>120){ micMeterT=now; showMic(micState==='held'?micHeld:null); }
  const prev=rmsHist[rmsHist.length-1], mn=Math.min.apply(null,rmsHist);
  rmsHist.push(rms); rmsHist.shift();
  const onset=rms>thr&&rms>prev*1.4&&rms>mn*1.8;
  if(micState==='held'){
    if(rms<thr*.6){ micRelease(); return; }
    if(onset&&now-micHeldAt>150){ micRelease(); }
    else{
      const f=yin(micBuf,ac.sampleRate), m=f?freqToMidi(f):null;
      if(m!=null&&m%12!==micHeld%12){ if(++micDiff>=4){ micRelease(); micCand=m; micCandN=1; } }
      else micDiff=0;
      return;
    }
  }
  if(rms<thr){ micCand=null; micCandN=0; return; }
  const f=yin(micBuf,ac.sampleRate), m=f?freqToMidi(f):null;
  if(m==null){ micCandN=0; return; }
  if(micCand!=null&&m%12===micCand%12) micCandN++; else{ micCand=m; micCandN=1; }
  if(micCandN>=3){
    micHeld=micCand; micHeldAt=now; micState='held'; micDiff=0;
    down('mic',micCand,.8,true); showMic(micCand);
  }
}
try{ const v=localStorage.getItem('kb_sens'); if(v) $('#micSens').value=v; }catch(e){}
micGain=Math.pow(1.5,parseInt($('#micSens').value,10)-5);
$('#micSens').addEventListener('input',e=>{
  micGain=Math.pow(1.5,parseInt(e.target.value,10)-5);
  try{ localStorage.setItem('kb_sens',e.target.value); }catch(_){}
});
function stopMic(){
  clearInterval(micTimer);
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  micStream=null; micPending=false; up('mic'); micState='idle'; micCand=null; micCandN=0;
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  if(silentEl) silentEl.play().catch(()=>{});
  $('#mic').textContent='Микрофон'; $('#mic').classList.remove('on'); $('#micRow').hidden=true; setMidiStatus('');
}
$('#mic').addEventListener('click',async()=>{
  if(micStream){ stopMic(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ setMidiStatus('Микрофон недоступен в этом браузере.'); return; }
  try{
    micPending=true;
    try{ if(navigator.audioSession) navigator.audioSession.type='play-and-record'; }catch(e){}
    if(silentEl) silentEl.pause();
    ensureAudio();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(micStream);
    micAn=ac.createAnalyser(); micAn.fftSize=4096; micBuf=new Float32Array(4096);
    src.connect(micAn);
    const z=ac.createGain(); z.gain.value=0; micAn.connect(z); z.connect(ac.destination);
    try{ await ac.resume(); }catch(e){}
    micNoise=.002;
    micPending=false;
    micTimer=setInterval(micTick,25);
    $('#mic').textContent='Микрофон: вкл'; $('#mic').classList.add('on'); $('#micRow').hidden=false; showMic(null);
  }catch(err){
    micStream=null; micPending=false;
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    if(silentEl) silentEl.play().catch(()=>{});
    setMidiStatus('Нет доступа к микрофону: '+(err&&err.message?err.message:'отказано'));
  }
});

/* ---------- ход песни ---------- */
function step(dt){
  const prev=beat;
  let nb=beat+dt*bpm/60;
  waiting=false;
  if(mode==='wait'){
    const n=notes[nextIdx];
    if(n&&nb>=n.s){ nb=n.s; waiting=true; }
  }
  beat=nb;
  if(mode!=='wait'&&beat<0&&Math.floor(beat)!==Math.floor(prev)) click();
  if(mode==='watch'){
    for(const n of notes){
      if(!n.st&&n.s<=beat){ n.st=1; autoHeld.set(n,voiceOn(n.m,.8)); }
    }
    for(const [n,v] of autoHeld){
      if(n.s+n.d-.05<=beat){ voiceOff(v); autoHeld.delete(n); }
    }
  }else if(mode==='play'){
    const w=.3*bpm/60;
    for(const n of notes){
      if(n.st===0&&n.s+w<beat) n.st=2;
    }
  }
  if(mode!=='wait'&&beat>endBeat+.6) finish();
}
function finish(){
  if(state==='done') return;
  state='done'; releaseAuto(); updateGo();
  if(mode==='watch') return;
  const total=notes.length;
  let title,stars,text;
  if(mode==='wait'){
    title='Готово!';
    stars=wrong===0?3:wrong<=3?2:wrong<=8?1:0;
    text='Ошибок: '+wrong;
    save(ITEMS[cur].id,'wait',-wrong);
  }else{
    const acc=Math.round(hits/total*100);
    title=acc>=90?'Отлично!':acc>=70?'Хорошо!':'Тренируйтесь дальше';
    stars=acc>=90?3:acc>=70?2:acc>=40?1:0;
    text='Попаданий: '+hits+' из '+total+' ('+acc+'%). Лишних нажатий: '+wrong;
    save(ITEMS[cur].id,'play',acc);
  }
  $('#rTitle').textContent=title;
  $('#rStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('#rText').textContent=text;
  $('#nextSong').style.display=cur<ITEMS.length-1?'':'none';
  $('#result').hidden=false;
  buildSongList();
}
function loadBest(){ try{ return JSON.parse(localStorage.getItem('kb_best')||'{}'); }catch(e){ return {}; } }
function save(id,m,val){
  try{
    const b=loadBest(); b[id]=b[id]||{};
    if(b[id][m]==null||val>b[id][m]) b[id][m]=val;
    localStorage.setItem('kb_best',JSON.stringify(b));
  }catch(e){}
}
function buildSongList(){
  const b=loadBest(), sel=$('#song'), groups={};
  sel.innerHTML='';
  ITEMS.forEach((it,i)=>{
    let og=groups[it.g];
    if(!og){ og=document.createElement('optgroup'); og.label=it.g; groups[it.g]=og; sel.appendChild(og); }
    const o=document.createElement('option'); o.value=String(i);
    const r=b[it.id]; let mark='';
    if(r&&r.play!=null) mark=' · '+r.play+'%';
    else if(r&&r.wait!=null) mark=' ✓';
    o.textContent=it.title+mark; og.appendChild(o);
  });
  sel.value=String(cur);
}

/* ---------- отрисовка ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function draw(){
  if(!W) return;
  const now=performance.now();
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,fallH);
  bg.addColorStop(0,'#0c0f1c'); bg.addColorStop(1,'#151a38');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,fallH);
  ctx.lineWidth=1;
  for(let i=1;i<15;i++){
    const x=Math.round(i*ww)+.5;
    ctx.strokeStyle=(i%7===0)?'rgba(255,255,255,.12)':'rgba(255,255,255,.05)';
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,fallH); ctx.stroke();
  }
  const b0=Math.floor(beat);
  for(let b=b0;b<=b0+6;b++){
    const y=fallH-(b-beat)*ppb; if(y<0||y>fallH) continue;
    ctx.strokeStyle='rgba(255,255,255,.04)';
    ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke();
  }
  // ноты
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,fallH); ctx.clip();
  ctx.font='600 11px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const active=new Set(), activeN=new Map();
  for(const n of notes){
    const g=geom[n.m]; if(!g) continue;
    const yb=fallH-(n.s-beat)*ppb, yt=yb-n.d*ppb;
    if(n.s<=beat&&beat<n.s+n.d&&(mode==='watch'||n.st!==1)&&state!=='idle'){ active.add(n.m); activeN.set(n.m,n); }
    if(yb<0||yt>fallH) continue;
    const h=Math.max(6,yb-yt-2);
    let col=n.h==='L'?(g.b?'#c2410c':'#f59e0b'):(g.b?'#8b5cf6':'#5b8cff'), alpha=1;
    if(n.st===1&&mode!=='watch'){ col='#3ddc97'; alpha=.4; }
    else if(n.st===2){ col='#ff5d6c'; alpha=.45; }
    ctx.globalAlpha=alpha; ctx.fillStyle=col;
    rr(g.x+1.5,yt,g.w-3,h,6); ctx.fill();
    ctx.globalAlpha=1;
    const label=nameOf(n.m);
    if(n.f){
      ctx.fillStyle='#fff'; ctx.font='700 15px system-ui,sans-serif';
      ctx.fillText(String(n.f),g.x+g.w/2,yt+Math.min(h/2,11));
      if(h>=42&&ctx.measureText(label).width<g.w-4){
        ctx.font='600 10px system-ui,sans-serif'; ctx.fillStyle='rgba(255,255,255,.8)';
        ctx.fillText(label,g.x+g.w/2,yt+h-9);
      }
    }else if(h>=15){
      ctx.font='600 11px system-ui,sans-serif';
      if(ctx.measureText(label).width<g.w-4){
        ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillText(label,g.x+g.w/2,yt+Math.min(h/2,9));
      }
    }
  }
  ctx.restore();
  // линия попадания
  ctx.fillStyle='rgba(91,140,255,.9)'; ctx.fillRect(0,fallH-2,W,2);

  // клавиатура
  const pset=new Set();
  for(const p of pressed.values()) if(p.disp!=null) pset.add(p.disp);
  const pulse=.55+.45*Math.sin(now/140);
  const expected=(mode==='wait'&&waiting&&notes[nextIdx])?notes[nextIdx].m:null;
  const keyColor=(m,black)=>{
    const bt=bad.get(m);
    if(bt&&now-bt<450) return 'rgba(255,93,108,'+(1-(now-bt)/450).toFixed(2)+')';
    if(pset.has(m)) return '#7aa2ff';
    if(expected===m) return 'rgba(255,209,102,'+pulse.toFixed(2)+')';
    if(active.has(m)) return black?'#8b5cf6':'#a9c2ff';
    return null;
  };
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(let m=LOW;m<=HIGH;m++){
    const g=geom[m]; if(g.b) continue;
    ctx.fillStyle='#f3f4fb'; ctx.fillRect(g.x,fallH,g.w,kbH);
    const c=keyColor(m,false);
    if(c){ ctx.fillStyle=c; ctx.fillRect(g.x,fallH,g.w,kbH); }
    ctx.strokeStyle='#9aa0c0'; ctx.lineWidth=1; ctx.strokeRect(g.x+.5,fallH+.5,g.w-1,kbH-1);
    ctx.fillStyle='#4a5070'; ctx.font='600 '+(ruNames?9:11)+'px system-ui,sans-serif';
    ctx.fillText(nameOf(m),g.x+g.w/2,fallH+kbH-8);
    const an=activeN.get(m);
    if(an&&an.f){
      ctx.fillStyle=an.h==='L'?'#f59e0b':'#5b8cff'; ctx.beginPath(); ctx.arc(g.x+g.w/2,fallH+kbH-34,11,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='700 14px system-ui,sans-serif'; ctx.fillText(String(an.f),g.x+g.w/2,fallH+kbH-29);
    }
  }
  for(let m=LOW;m<=HIGH;m++){
    const g=geom[m]; if(!g.b) continue;
    const bh=kbH*.62;
    ctx.fillStyle='#1a1e34'; rr(g.x,fallH,g.w,bh,4); ctx.fill();
    const c=keyColor(m,true);
    if(c){ ctx.fillStyle=c; rr(g.x,fallH,g.w,bh,4); ctx.fill(); }
    const an=activeN.get(m);
    if(an&&an.f){
      ctx.fillStyle=an.h==='L'?'#f59e0b':'#5b8cff'; ctx.beginPath(); ctx.arc(g.x+g.w/2,fallH+bh-16,9,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='700 12px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText(String(an.f),g.x+g.w/2,fallH+bh-12);
    }
  }
  // подсказка
  let l='', r='';
  if(state==='idle') l='Нажмите «Старт». Клавиши можно нажимать и просто так.';
  else if(state==='pause') l='Пауза';
  else if(state==='done') l=mode==='watch'?'Готово':'Песня закончена';
  else if(beat<0) l=mode==='wait'?'Приготовьтесь…':'Приготовьтесь… '+Math.ceil(-beat);
  else if(mode==='wait'){ const n=notes[nextIdx]; l=n?((waiting?'Сыграйте: ':'Следующая: ')+nameOf(n.m)+(n.f?' · палец '+n.f+(n.h==='L'?' левой':' правой'):'')):''; }
  else if(mode==='play') l='Играйте в такт';
  else l='Слушайте и смотрите';
  if(mode!=='watch') r='✓ '+hits+'/'+notes.length+'  ✗ '+wrong;
  if(l!==lastL){ $('#hintL').textContent=l; lastL=l; }
  if(r!==lastR){ $('#hintR').textContent=r; lastR=r; }
}
let lastL='', lastR='';

let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if(state==='run') step(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- теория ---------- */
let tPages=null, tIdx=0;
function showTheory(i){
  const it=ITEMS[cur]; if(!it.pages) return;
  tPages=it.pages; tIdx=i||0; renderTheory(); $('#theory').hidden=false;
}
function renderTheory(){
  const p=tPages[tIdx], it=ITEMS[cur];
  $('#tTag').textContent=it.title+' · '+(tIdx+1)+'/'+tPages.length;
  $('#tTitle').textContent=p.h;
  $('#tBody').innerHTML=p.b;
  $('#tPrev').style.visibility=tIdx?'visible':'hidden';
  const last=tIdx===tPages.length-1;
  $('#tNext').textContent=last?(it.seq?'К практике ▶':(cur<ITEMS.length-1?'Следующий урок ▶':'Закрыть')):'Дальше';
  $('#theory').scrollTop=0;
}
$('#tNext').addEventListener('click',()=>{
  if(tIdx<tPages.length-1){ tIdx++; renderTheory(); return; }
  $('#theory').hidden=true;
  if(!ITEMS[cur].seq){
    save(ITEMS[cur].id,'wait',0);
    if(cur<ITEMS.length-1) loadSong(cur+1,true);
    buildSongList();
  }
});
$('#tPrev').addEventListener('click',()=>{ if(tIdx>0){ tIdx--; renderTheory(); } });
$('#theoryBtn').addEventListener('click',()=>showTheory(0));

/* ---------- интерфейс ---------- */
$('#go').addEventListener('click',()=>{
  if(!notes.length){ showTheory(0); return; }
  ensureAudio();
  if(state==='idle'||state==='pause'){ state='run'; }
  else if(state==='run'){ state='pause'; releaseAuto(); }
  else if(state==='done'){ reset(); state='run'; }
  updateGo();
});
$('#restart').addEventListener('click',()=>reset());
$('#song').addEventListener('change',e=>loadSong(parseInt(e.target.value,10),true));
$('#modes').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.m;
  for(const x of $('#modes').children) x.classList.toggle('on',x===b);
  reset();
});
$('#tempo').addEventListener('input',e=>{ bpm=parseInt(e.target.value,10); $('#tempoV').textContent=bpm; });
$('#names').addEventListener('click',()=>{
  ruNames=!ruNames; $('#names').textContent=ruNames?'До Ре Ми':'C D E';
});
$('#midiSnd').addEventListener('click',()=>{
  midiSound=!midiSound;
  $('#midiSnd').textContent='Звук с MIDI: '+(midiSound?'вкл':'выкл');
  $('#midiSnd').classList.toggle('on',midiSound);
});
$('#oct').addEventListener('click',()=>{
  anyOct=!anyOct;
  $('#oct').textContent='Любая октава: '+(anyOct?'вкл':'выкл');
  $('#oct').classList.toggle('on',anyOct);
});
$('#again').addEventListener('click',()=>{ reset(); ensureAudio(); state='run'; updateGo(); });
$('#nextSong').addEventListener('click',()=>{
  loadSong(Math.min(cur+1,ITEMS.length-1),true);
  if(!ITEMS[cur].pages){ ensureAudio(); state='run'; updateGo(); }
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
buildSongList();
loadSong(0,true);
layout();
requestAnimationFrame(frame);
})();
</script>
